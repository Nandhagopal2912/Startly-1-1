services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "true"
      RATE_LIMIT_PER_MINUTE: "30"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports: 
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
